name: Milestone sync from phase label

# Mechanical milestone bookkeeping: no third-party actions, no hardcoded milestone
# numbers, and no API write unless the target milestone actually changes.
#
# Triggers are `opened` and `labeled` ONLY. `unlabeled` is deliberately absent: a
# label removal must never move or clear a milestone.
#
# Mapping, fixed precedence (highest first), no judgment:
#   phase: new lanes   -> Phase 4 - New lanes
#   phase: playback UX -> Phase 3 - Playback UX
#   phase: maintenance -> Maintenance queue
#
# Manual assignments win: an issue whose current milestone is not one of the three
# mapped milestones is left untouched. No code path ever clears a milestone.

on:
  issues:
    types: [opened, labeled]

# Serialize per issue so two rapid label events cannot interleave: each run reads
# the issue after the previous one finishes, and the newest pending run wins.
concurrency:
  group: milestone-sync-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync milestone from phase label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          : "${GH_REPO:?GH_REPO is required}"
          : "${ISSUE_NUMBER:?ISSUE_NUMBER is required}"

          # label -> milestone title, in precedence order (highest first)
          precedence_labels=("phase: new lanes" "phase: playback UX" "phase: maintenance")
          precedence_titles=("Phase 4 - New lanes" "Phase 3 - Playback UX" "Maintenance queue")

          # Resolve milestone numbers by title at run time; never hardcode them.
          milestones_json=$(gh api --paginate --slurp "repos/${GH_REPO}/milestones?state=all&per_page=100")
          milestone_number() {
            printf '%s' "$milestones_json" \
              | jq -r --arg t "$1" '[flatten[] | select(.title == $t)][0].number // empty'
          }

          # Decide what to do for one issue snapshot. Prints one line:
          #   TARGET <number> <title>  when a write is needed
          #   SKIP <reason>            when the issue must be left untouched
          plan_for_issue() {
            local labels current target_title target_number mapped title
            labels=$(printf '%s' "$1" | jq -r '.labels[].name')
            current=$(printf '%s' "$1" | jq -r '.milestone.number // empty')

            target_title=""
            for i in "${!precedence_labels[@]}"; do
              if grep -Fxq -- "${precedence_labels[$i]}" <<< "$labels"; then
                target_title="${precedence_titles[$i]}"
                break
              fi
            done
            if [ -z "$target_title" ]; then
              echo "SKIP no recognized phase label"
              return 0
            fi

            target_number=$(milestone_number "$target_title")
            if [ -z "$target_number" ]; then
              echo "SKIP milestone '${target_title}' not found"
              return 0
            fi

            # Manual assignments win: only migrate between the three mapped milestones.
            if [ -n "$current" ]; then
              mapped=0
              for title in "${precedence_titles[@]}"; do
                if [ "$current" = "$(milestone_number "$title")" ]; then
                  mapped=1
                  break
                fi
              done
              if [ "$mapped" -ne 1 ]; then
                echo "SKIP manual milestone"
                return 0
              fi
            fi

            # Idempotent: nothing to write when the milestone is already the target.
            if [ "$current" = "$target_number" ]; then
              echo "SKIP already on '${target_title}'"
              return 0
            fi

            echo "TARGET ${target_number} ${target_title}"
          }

          decision=$(plan_for_issue "$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}")")
          if [[ "$decision" != TARGET* ]]; then
            echo "Issue #${ISSUE_NUMBER}: ${decision#SKIP }, nothing to do."
            exit 0
          fi

          # Re-plan from a fresh read so an assignment made while this run was queued
          # or in flight still wins, and a concurrent run's write is not repeated.
          fresh=$(plan_for_issue "$(gh api "repos/${GH_REPO}/issues/${ISSUE_NUMBER}")")
          if [ "$fresh" != "$decision" ]; then
            echo "Issue #${ISSUE_NUMBER}: state changed while running, leaving untouched."
            exit 0
          fi

          read -r _ target_number target_title <<< "$decision"
          echo "Issue #${ISSUE_NUMBER}: setting milestone to '${target_title}' (#${target_number})."
          gh api -X PATCH "repos/${GH_REPO}/issues/${ISSUE_NUMBER}" -F milestone="$target_number" >/dev/null
