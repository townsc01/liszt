name: Refresh live catalogue
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run sync
      - name: Publish catalogue update
        run: |
          if git diff --quiet -- data/catalogue.json docs/catalogue.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json docs/catalogue.json
          git commit -m "Refresh live catalogue"
          git push
