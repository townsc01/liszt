name: Refresh live catalogue

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
      - name: Commit updated catalogue
        run: |
          if [ -n "$(git status --porcelain data/catalogue.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/catalogue.json
            git commit -m "Refresh live catalogue [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
