name: Refresh live catalogue

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: catalogue-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          TPDB_API_KEY: ${{ secrets.TPDB_API_KEY }}
      # Translation is a background pass, never part of sync. Running it here (and
      # committing its cache below) is what makes translations durable rather than
      # re-derived from the LLM on every cold boot. With no key it is glossary-only.
      - run: npm run backfill:translate
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Commit updated catalogue
        run: |
          if [ -n "$(git status --porcelain data/catalogue.json data/translations.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/catalogue.json data/translations.json
            git commit -m "Refresh live catalogue [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit"
          fi
