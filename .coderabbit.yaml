# CodeRabbit configuration for liszt
# Reference: https://docs.coderabbit.ai/reference/configuration
language: "en-US"
early_access: false

reviews:
  # Concise, low-noise reviews - findings over prose.
  profile: "chill"
  poem: false
  review_status: true
  high_level_summary: true
  collapse_walkthrough: true
  request_changes_workflow: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    # Defaults already cover lock files; keep reviews off vendored/build output.
    - "!dist/**"
    - "!node_modules/**"
    - "!docs/**.md"  # specs are reviewed by humans/agents; docs PRs are mechanical
  path_instructions:
    - path: "src/matching.js"
      instructions: |
        The matching gate contract in docs/specs/matching-algorithm.md is authoritative:
        duration +/-2s AND (performer-name OR MMDD-code). Passes may differ in query
        breadth, never in the gate. Flag any change that weakens or bypasses the gate.
        Candidate authors/uploaders may be objects ({id, name, url}) - identity must be
        extracted, never String()-ed.
    - path: "src/sxyprn.js"
      instructions: |
        Per docs/specs/sxyprn-embed.md. Sxyprn performer matching must survive retitled
        uploads (camelCase splits, trailing tags like "ls"). Native posts beat external
        duplicates before any verification limit is applied.
    - path: "src/eporner.js"
      instructions: |
        Per docs/specs/eporner-embed.md and matching-algorithm.md. The trusted-uploader
        pool fallback must be wired into production callers (src/server.js), not only
        tests. First-name + MMDD house style ("LLW - LanaWills 924") is the identity
        signal inside trusted pools.
    - path: "test/**"
      instructions: |
        Tests use node:test. Every fix needs a regression test proving the behavior;
        flag fixes landed without a covering test.

chat:
  auto_reply: true
